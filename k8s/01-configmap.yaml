# Configurações NÃO sensíveis da aplicação e do banco.
# Dados sensíveis (senha) ficam no Secret (02-secret.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vehicle-sales-config
  namespace: vehicle-sales
  labels:
    app.kubernetes.io/part-of: vehicle-sales
data:
  NODE_ENV: 'production'
  PORT: '3000'
  DATABASE_HOST: 'postgres-service'
  DATABASE_PORT: '5432'
  DATABASE_NAME: 'vehicle_sales'
  DATABASE_USER: 'vehicles'
  # Serviço de identidade, publicado no namespace vehicle-identity.
  AUTH_ISSUER: 'http://localhost:8180/realms/vehicle-sales'
  AUTH_AUDIENCE: 'vehicle-sales-api'
  AUTH_JWKS_URI: 'http://keycloak.vehicle-identity.svc.cluster.local:8080/realms/vehicle-sales/protocol/openid-connect/certs'
