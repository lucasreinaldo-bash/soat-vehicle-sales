# API da plataforma de revenda de veículos: Deployment + Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-sales-api
  namespace: vehicle-sales
  labels:
    app: vehicle-sales-api
    app.kubernetes.io/part-of: vehicle-sales
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vehicle-sales-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: vehicle-sales-api
    spec:
      # As migrations rodam UMA vez por rollout, antes de qualquer réplica da API
      # subir — evita que as N réplicas disputem o schema na inicialização.
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DATABASE_HOST" -p "$DATABASE_PORT" -U "$DATABASE_USER"; do
                echo "aguardando o PostgreSQL..."; sleep 2;
              done
          envFrom:
            - configMapRef:
                name: vehicle-sales-config
        - name: run-migrations
          image: vehicle-sales-api:latest
          imagePullPolicy: IfNotPresent
          command: ['npx', 'prisma', 'migrate', 'deploy']
          # ATENÇÃO à ordem: o Kubernetes só interpola $(VAR) com variáveis
          # declaradas ANTES na lista. DATABASE_URL precisa vir por último.
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: { name: vehicle-sales-config, key: DATABASE_HOST }
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef: { name: vehicle-sales-config, key: DATABASE_PORT }
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef: { name: vehicle-sales-config, key: DATABASE_NAME }
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef: { name: vehicle-sales-config, key: DATABASE_USER }
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: vehicle-sales-secret, key: DATABASE_PASSWORD }
            - name: DATABASE_URL
              value: >-
                postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)?schema=public
      containers:
        - name: api
          image: vehicle-sales-api:latest
          imagePullPolicy: IfNotPresent
          command: ['node', 'dist/main']
          ports:
            - name: http
              containerPort: 3000
          env:
            # Configuração não sensível vem do ConfigMap...
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef: { name: vehicle-sales-config, key: NODE_ENV }
            - name: PORT
              valueFrom:
                configMapKeyRef: { name: vehicle-sales-config, key: PORT }
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: { name: vehicle-sales-config, key: DATABASE_HOST }
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef: { name: vehicle-sales-config, key: DATABASE_PORT }
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef: { name: vehicle-sales-config, key: DATABASE_NAME }
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef: { name: vehicle-sales-config, key: DATABASE_USER }
            # ...e a senha vem do Secret, nunca do ConfigMap.
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: vehicle-sales-secret, key: DATABASE_PASSWORD }
            - name: DATABASE_URL
              value: >-
                postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)?schema=public
          resources:
            requests:
              memory: '256Mi'
              cpu: '200m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          # /health responde sem tocar no banco (liveness): reiniciar o pod não
          # resolveria uma indisponibilidade do Postgres.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          # /health/ready valida a conexão com o banco: sem banco, o pod sai do
          # balanceamento do Service em vez de responder erro ao cliente.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-sales-api-service
  namespace: vehicle-sales
  labels:
    app: vehicle-sales-api
spec:
  # NodePort funciona tanto em minikube/kind quanto em cloud. Em produção,
  # troque por LoadBalancer (ou coloque um Ingress na frente).
  type: NodePort
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: vehicle-sales-api
