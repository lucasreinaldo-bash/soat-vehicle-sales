# API de vendas e o seu banco. O serviço de identidade é APARTADO e sobe pelo
# próprio repositório (soat-vehicle-identity); suba-o antes: docker compose up
services:
  db:
    image: postgres:16-alpine
    container_name: vehicle_sales_db
    environment:
      POSTGRES_USER: vehicles
      POSTGRES_PASSWORD: vehicles
      POSTGRES_DB: vehicle_sales
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vehicles -d vehicle_sales']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: vehicle_sales_api
    environment:
      DATABASE_URL: postgresql://vehicles:vehicles@db:5432/vehicle_sales?schema=public
      PORT: 3000
      NODE_ENV: production
      # Validação dos tokens emitidos pelo serviço de identidade. O emissor é o
      # endereço público do Keycloak; as chaves são buscadas pela rede interna.
      AUTH_ISSUER: http://localhost:8180/realms/vehicle-sales
      AUTH_AUDIENCE: vehicle-sales-api
      AUTH_JWKS_URI: http://keycloak:8080/realms/vehicle-sales/protocol/openid-connect/certs
      # Segredo compartilhado com o processador de pagamento (assinatura HMAC do
      # webhook). Valor de desenvolvimento — em produção, vem de um cofre.
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-segredo-webhook-desenvolvimento}
    ports:
      - '3000:3000'
    # Só inicia depois que o Postgres estiver realmente aceitando conexões,
    # garantindo que `prisma migrate deploy` (no CMD da imagem) não falhe.
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    # Sem healthcheck, 'docker compose up --wait' devolve o controle assim que o
    # container RODA — antes de a aplicação aplicar as migrations e escutar a
    # porta. O /health/ready só responde quando a API alcança o banco.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/ready >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    # A API participa das duas redes; o banco de vendas, só da sua. Os bancos
    # de vendas e de identidade nunca compartilham rede.
    networks: [default, identity]

volumes:
  pgdata:

# Rede criada pelo serviço de identidade. Se ele não estiver no ar, o compose
# falha com 'network vehicle-identity not found' — suba a identidade primeiro.
networks:
  identity:
    external: true
    name: vehicle-identity
